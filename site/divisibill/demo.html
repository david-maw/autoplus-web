<!DOCTYPE html>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<html>
<head>
    <title>Demo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1 id="demo">Demo</h1>
<p>When you first run DivisiBill after installation, it will end up on the <a href="lineitemspage.html">Items</a> page, which will contain a list of bill items. Here's a short video of some basic operations using the default bill.</p>
<center>
  <video width=90% controls autoplay muted>
    <source src="demo.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>
</center>

    <script>
        let li = window.location.href.lastIndexOf("#");
        var s;
        if (li >= 0) {
            s = window.location.href.substring(li + 1);
        }

        if (s != null && s.length > 0) {
            let e = document.getElementById(s);
            if (e != null) {
                let h = e.innerHTML;
                e.innerHTML = "<mark>" + h + "</mark>";
            }
        }
    </script>
</body>
</html>
