<!DOCTYPE html>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<html>
<head>
    <title>Program Settings Page</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <h1 id="program-settings-page">Program Settings Page</h1>
<p>This is where the program settings (like default tip or tax rates) are entered.</p>
<p>Most fields are self evident but you can tap on any highlighted area to get further explanation (on a desktop browser you can also hover over an area to see its name).</p>
<p><object type=image/svg+xml data="settingspage.svg" height=600 style="width:90%"></object></p>

    <script>
        let li = window.location.href.lastIndexOf("#");
        var s;
        if (li >= 0) {
            s = window.location.href.substring(li + 1);
        }

        if (s != null && s.length > 0) {
            let e = document.getElementById(s);
            if (e != null) {
                let h = e.innerHTML;
                e.innerHTML = "<mark>" + h + "</mark>";
            }
        }
    </script>
</body>
</html>
