<!DOCTYPE html>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<html>
<head>
    <title>Items Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1 id="items-page">Items Page</h1>
<p>This is where the individual items and the information about them is entered, either by scanning a paper bill or manually. It looks something like this.</p>
<p>Tap on a highlighted area to see what it does (on a desktop browser you can also hover over an area to see its name).</p>
<p><object type=image/svg+xml data="itemspage.svg" height=600 style="width:90%"></object></p>

    <script>
        let li = window.location.href.lastIndexOf("#");
        var s;
        if (li >= 0) {
            s = window.location.href.substring(li + 1);
        }

        if (s != null && s.length > 0) {
            let e = document.getElementById(s);
            if (e != null) {
                let h = e.innerHTML;
                e.innerHTML = "<mark>" + h + "</mark>";
            }
        }
    </script>
</body>
</html>
